<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qurtuba Quest Chat</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b141a;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      background: #202c33;
      color: #25d366;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: min(92%, 420px);
      margin: 45px auto;
      padding: 24px;
      background: #202c33;
      border-radius: 16px;
    }

    h2 { margin-top: 0; }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #40515a;
      border-radius: 8px;
      background: #0b141a;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      width: 100%;
      margin-top: 10px;
      background: #25d366;
      color: #062b20;
      font-weight: bold;
    }

    .secondary {
      margin-top: 12px;
      background: transparent;
      color: #25d366;
    }

    #status {
      color: #ffcc80;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #app { display: none; }

    .account {
      overflow-wrap: anywhere;
      color: #b9c8ce;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>Qurtuba Quest</header>

  <section class="container" id="auth">
    <h2 id="formTitle">Create Account</h2>

    <form id="authForm">
      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password (at least 6 characters)"
        minlength="6"
        autocomplete="current-password"
        required
      >

      <button class="primary" id="submitBtn" type="submit">
        Sign Up
      </button>
    </form>

    <button class="secondary" id="switchBtn" type="button">
      Already have an account? Log In
    </button>

    <p id="status" role="status"></p>
  </section>

  <section class="container" id="app">
    <h2>Welcome!</h2>
    <p class="account">You are logged in.</p>
    <p class="account" id="accountEmail"></p>

    <p id="appStatus">
      Your account is ready. Chat and calling are the next steps.
    </p>

    <button class="primary" id="logoutBtn">
      Log Out
    </button>
  </section>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD82Z5nw75a5newgYv_IkbmQK-1yJXKN3k",
      authDomain: "qurtuba-quest.firebaseapp.com",
      databaseURL:
        "https://qurtuba-quest-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qurtuba-quest",
      storageBucket: "qurtuba-quest.firebasestorage.app",
      messagingSenderId: "138703537259",
      appId: "1:138703537259:web:2af20c2b6d5d4567199d2e"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    let isLogin = false;

    const authSection = document.getElementById("auth");
    const appSection = document.getElementById("app");
    const status = document.getElementById("status");
    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const passwordInput = document.getElementById("password");

    switchBtn.addEventListener("click", () => {
      isLogin = !isLogin;

      formTitle.textContent =
        isLogin ? "Log In" : "Create Account";

      submitBtn.textContent =
        isLogin ? "Log In" : "Sign Up";

      switchBtn.textContent = isLogin
        ? "Need an account? Sign Up"
        : "Already have an account? Log In";

      passwordInput.autocomplete =
        isLogin ? "current-password" : "new-password";

      status.textContent = "";
    });

    document.getElementById("authForm").addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const email = document
          .getElementById("email").value.trim();

        const password = passwordInput.value;

        submitBtn.disabled = true;
        status.textContent = "Please wait...";

        try {
          if (isLogin) {
            await auth.signInWithEmailAndPassword(
              email, password
            );
          } else {
            await auth.createUserWithEmailAndPassword(
              email, password
            );
          }
        } catch (error) {
          const messages = {
            "auth/email-already-in-use":
              "This email is already registered. Please log in.",
            "auth/invalid-email":
              "Please enter a valid email address.",
            "auth/weak-password":
              "Choose a stronger password.",
            "auth/invalid-credential":
              "Incorrect email or password.",
            "auth/network-request-failed":
              "Network error. Check your internet connection."
          };

          status.textContent =
            messages[error.code] ||
            "Error: " + error.message;
        } finally {
          submitBtn.disabled = false;
        }
      }
    );

    auth.onAuthStateChanged((user) => {
      if (user) {
        authSection.style.display = "none";
        appSection.style.display = "block";

        document.getElementById("accountEmail").textContent =
          user.email || "";

      } else {
        authSection.style.display = "block";
        appSection.style.display = "none";
      }
    });

    document.getElementById("logoutBtn").addEventListener(
      "click",
      async () => {
        try {
          await auth.signOut();
        } catch (error) {
          document.getElementById("appStatus").textContent =
            "Could not log out: " + error.message;
        }
      }
    );
  </script>
</body>
</html>
